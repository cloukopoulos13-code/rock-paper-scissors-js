<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <script src="./script.js" defer></script>
</head>
<body>
    <h1 class="main-title">Rock, Paper, Scissors</h1>
    <h2>Make your choice to play the game.</h2>
    <div class="results">
        <p class="player-pick"></p>
        <p class="comp-pick"></p>
        <p class="round-winner"></p>
        <p class="player-score">Your Score: 0</p>
        <p class="comp-score">Computer Score: 0</p>
    </div>
    <button class="rock">Rock</button>
    <button class="paper">Paper</button>
    <button class="scissors">Scissors</button>
    <p class="winner"></p>
</body>
</html>
